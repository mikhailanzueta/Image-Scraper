<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reddit Image Scraper</title>
        <link rel="stylesheet" href="./styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Londrina+Shadow&family=Onest:wght@100..900&family=SUSE:wght@100..800&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="heading">
            <div class="title">
                <h1>Reddit Image Scraper</h1>
                <h3 class="paragraph">Below is a Reddit image scraper. Enter the desired URL and the number of images you want.</h3>
                <h3 class="paragraph">You can also download the images.</h3>
                <h5 class="paragraph">Max number of images is limited to 100.</h5>
            </div>
        </div>
        <div class="form-container">
            <form>
                <div class="form-field">
                    <label for="url">Url: </label>
                    <input type="text" class="form-input" name="url" placeholder="Enter the URL">
                </div>
                <div class="form-field">
                    <label for="numer">Number of Images: </label>
                    <input type="number" class="form-input" name="number" placeholder="Enter number of images">
                </div>
                <button type="submit" class="submit">Retrieve</button>
            </form>
        </div>
    </body>
</html>
